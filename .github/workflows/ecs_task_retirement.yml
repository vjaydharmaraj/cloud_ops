name: ECS Service Refresh Automation

on:
  schedule:
    - cron: '0 0 */7 * *'  # Run the job every 7 days (weekly)
  workflow_dispatch:

jobs:
  ecs_service_refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip  
          pip install boto3 requests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}           # aws keys
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run ECS Service Refresh Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}           # slack token 
        run: |
          python python_scripts/ecs_task_auto_retirement.py
